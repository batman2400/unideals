    <!--
      This is the pre-hydration fallback (equivalent to a Next.js root
      layout's default metadata/title template). Every route overrides
      title/description/canonical client-side via react-helmet-async
      (see src/pages/*.jsx), but this must stay accurate for crawlers or
      social bots that don't execute JS.
    -->
    <title data-rh="true">Uni Deals | Student Discounts & Perks in Sri Lanka</title>
    <script>
      (function () {
        var path = (location.pathname || "/").replace(/\/+$/, "") || "/";
        var title = "";
        if (path === "/deals") title = "Student Deals | Uni Deals";
        else if (path.indexOf("/deals/") === 0) title = "Deal | Uni Deals";
        else if (path === "/categories") title = "Categories | Uni Deals";
        else if (path.indexOf("/category/") === 0) title = "Category | Uni Deals";
        else if (path === "/brands") title = "Brands | Uni Deals";
        else if (path.indexOf("/brand/") === 0) title = "Brand | Uni Deals";
        else if (path === "/blog") title = "Blog | Uni Deals";
        else if (path.indexOf("/blog/") === 0) title = "Blog | Uni Deals";
        else if (path === "/events") title = "Student Events in Sri Lanka | Uni Deals";
        else if (path === "/login" || path === "/signup") title = "Uni Deals";
        if (title) document.title = title;
      })();
    </script>
