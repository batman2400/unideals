<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!--
      This is the pre-hydration fallback (equivalent to a Next.js root
      layout's default metadata/title template). Every route overrides
      title/description/canonical client-side via react-helmet-async
      (see src/pages/*.jsx), but this must stay accurate for crawlers or
      social bots that don't execute JS.
    -->
    <title>Uni Deals | Student Discounts & Perks in Sri Lanka</title>
    <script>
      (function () {
        var path = (location.pathname || "/").replace(/\/+$/, "") || "/";
        var title = "";
        if (path === "/deals") title = "Student Deals | Uni Deals";
        else if (path.indexOf("/deals/") === 0) title = "Deal | Uni Deals";
        else if (path === "/categories") title = "Categories | Uni Deals";
        else if (path.indexOf("/category/") === 0) title = "Category | Uni Deals";
        else if (path === "/brands") title = "Brands | Uni Deals";
        else if (path.indexOf("/brand/") === 0) title = "Brand | Uni Deals";
        else if (path === "/blog") title = "Blog | Uni Deals";
        else if (path.indexOf("/blog/") === 0) title = "Blog | Uni Deals";
        else if (path === "/events") title = "Student Events in Sri Lanka | Uni Deals";
        else if (path === "/login" || path === "/signup") title = "Uni Deals";
        if (title) document.title = title;
      })();
    </script>
    <link rel="canonical" href="https://www.unideals.co/" />
    <meta
      name="description"
      content="Uni Deals is Sri Lanka's student discount and perks platform. Unlock exclusive offers on food, tech, fashion, and more with your verified university email."
    />
    <meta name="theme-color" content="#29695b" />
    <meta name="application-name" content="Uni Deals" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS home-screen / standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Uni Deals" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v9.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48-v9.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192-v9.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />

    <!-- Android / Chrome install -->
    <link rel="manifest" href="/manifest.webmanifest?v=16" />

    <!-- Social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.unideals.co/" />
    <meta property="og:site_name" content="Uni Deals" />
    <meta property="og:title" content="Uni Deals | Student Discounts & Perks in Sri Lanka" />
    <meta
      property="og:description"
      content="Uni Deals is Sri Lanka's student discount and perks platform. Unlock exclusive offers on food, tech, fashion, and more with your verified university email."
    />
    <meta property="og:image" content="https://www.unideals.co/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.unideals.co/og-default.png" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Uni Deals",
      "alternateName": "UniDeals",
      "url": "https://www.unideals.co",
      "logo": {
        "@type": "ImageObject",
        "url": "https://www.unideals.co/logo-512.png",
        "width": 512,
        "height": 512
      },
      "image": "https://www.unideals.co/logo-512.png",
      "description": "A dedicated discount and perks platform for university students in Sri Lanka."
    }
    </script>

    <!-- Google Fonts: Manrope + Inter -->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols (Icons) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-background text-on-background font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
